name: Build and Test

on:
  push:
    branches: [ main, cleanup-project-Tim-5 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            make \
            gcc \
            g++ \
            flex \
            bison \
            libpcap-dev \
            libssl-dev \
            python3 \
            python3-dev \
            swig \
            zlib1g-dev \
            libmaxminddb-dev \
            libkrb5-dev

      - name: Configure
        run: |
          ./configure --disable-spicy --disable-javascript --disable-python --disable-cluster-backend-zeromq

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"

      - name: Show build result
        if: always()
        run: |
          echo "Build directory contents:"
          ls -la build/src/ 2>/dev/null | head -20 || echo "Build directory not found"